<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="Success, danger, warning, info — solid + subtle" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-base);display:flex;gap:14px;box-sizing:border-box;font-family:var(--font-sans)}.grp{flex:1;display:flex;flex-direction:column;gap:8px}.solid{height:44px;border-radius:var(--radius-sm)}.subtle{height:36px;border-radius:var(--radius-sm)}.lbl{font-size:12px;color:var(--text-tertiary)}</style>
</head><body>
<div class="grp"><div class="solid" style="background:var(--status-success)"></div><div class="subtle" style="background:var(--status-success-subtle)"></div><span class="lbl">success</span></div>
<div class="grp"><div class="solid" style="background:var(--status-danger)"></div><div class="subtle" style="background:var(--status-danger-subtle)"></div><span class="lbl">danger</span></div>
<div class="grp"><div class="solid" style="background:var(--status-warning)"></div><div class="subtle" style="background:var(--status-warning-subtle)"></div><span class="lbl">warning</span></div>
<div class="grp"><div class="solid" style="background:var(--status-info)"></div><div class="subtle" style="background:var(--status-info-subtle)"></div><span class="lbl">info</span></div>
</body></html>
