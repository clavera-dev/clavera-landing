<!-- @dsCard group="Colors" viewport="700x180" name="Amber accent" subtitle="Warm LED accent — the one saturated color" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-base);box-sizing:border-box}.row{display:flex;gap:8px}.sw{flex:1;height:80px;border-radius:var(--radius-sm);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}.sw span{font:11px var(--font-mono);color:var(--graphite-950);opacity:.75}.glow{margin-top:14px;display:flex;align-items:center;gap:10px}.dot{width:10px;height:10px;border-radius:50%;background:var(--amber-500);box-shadow:0 0 16px 2px var(--amber-500)}.cap{font:12px var(--font-sans);color:var(--text-tertiary)}</style>
</head><body>
<div class="row">
<div class="sw" style="background:var(--amber-200)"><span>200</span></div>
<div class="sw" style="background:var(--amber-400)"><span>400</span></div>
<div class="sw" style="background:var(--amber-500)"><span>500</span></div>
<div class="sw" style="background:var(--amber-600)"><span>600</span></div>
<div class="sw" style="background:var(--amber-700)"><span>700</span></div>
</div>
<div class="glow"><div class="dot"></div><span class="cap">glow — reserved for the primary accent moment (CTA hover, active status)</span></div>
</body></html>
