<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="How dark elevation stacks, and the paper alternative" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:0;display:flex;font-family:var(--font-sans)}.dark{flex:1.4;background:var(--bg-base);padding:20px;display:flex;align-items:center;box-sizing:border-box}.stack{background:var(--bg-surface);border-radius:var(--radius-md);padding:16px;display:flex;gap:12px;width:100%}.card{flex:1;background:var(--bg-elevated);border:1px solid var(--border-hairline);border-radius:var(--radius-sm);height:64px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-tertiary)}.card b{background:var(--bg-elevated-2);border-radius:var(--radius-xs);padding:2px 6px;margin-left:4px}.paper{flex:1;background:var(--bg-paper);padding:20px;display:flex;align-items:center;justify-content:center;gap:12px;box-sizing:border-box}.pcard{background:var(--bg-paper-elevated);box-shadow:var(--shadow-paper-e1);border-radius:var(--radius-sm);padding:14px 18px;font-size:12px;color:var(--text-on-paper-secondary)}</style>
</head><body>
<div class="dark"><div class="stack"><div class="card">surface<b>elevated</b></div></div></div>
<div class="paper"><div class="pcard">paper elevated</div></div>
</body></html>
