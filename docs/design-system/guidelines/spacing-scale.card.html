<!-- @dsCard group="Spacing" viewport="700x260" name="Scale" subtitle="4px base — space-1 through space-32" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-base);box-sizing:border-box;display:flex;flex-direction:column;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}.row{display:flex;align-items:center;gap:10px}.bar{height:10px;background:var(--accent);border-radius:2px}.tok{width:64px}</style>
</head><body>
<div class="row"><span class="tok">space-1</span><div class="bar" style="width:var(--space-1)"></div></div>
<div class="row"><span class="tok">space-2</span><div class="bar" style="width:var(--space-2)"></div></div>
<div class="row"><span class="tok">space-3</span><div class="bar" style="width:var(--space-3)"></div></div>
<div class="row"><span class="tok">space-4</span><div class="bar" style="width:var(--space-4)"></div></div>
<div class="row"><span class="tok">space-6</span><div class="bar" style="width:var(--space-6)"></div></div>
<div class="row"><span class="tok">space-8</span><div class="bar" style="width:var(--space-8)"></div></div>
<div class="row"><span class="tok">space-12</span><div class="bar" style="width:var(--space-12)"></div></div>
<div class="row"><span class="tok">space-16</span><div class="bar" style="width:var(--space-16)"></div></div>
<div class="row"><span class="tok">space-24</span><div class="bar" style="width:var(--space-24)"></div></div>
<div class="row"><span class="tok">space-32</span><div class="bar" style="width:var(--space-32)"></div></div>
</body></html>
