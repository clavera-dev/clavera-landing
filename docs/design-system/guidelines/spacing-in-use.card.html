<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-base);box-sizing:border-box}.card{background:var(--bg-elevated);border:1px solid var(--border-hairline);border-radius:var(--radius-lg);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-6);font-family:var(--font-sans)}.row{display:flex;gap:var(--space-3)}.chip{background:var(--bg-elevated-2);border-radius:var(--radius-sm);padding:6px 12px;font-size:12px;color:var(--text-secondary)}.lbl{font-size:10px;color:var(--text-tertiary);font-family:var(--font-mono)}</style>
</head><body>
<div class="card">
<div><span class="lbl">padding: space-6 · gap: space-6</span></div>
<div class="row"><div class="chip">Bicicleta urbana</div><div class="chip">E-bike</div><div class="chip">Cargo bike</div></div>
<span class="lbl">gap: space-3 between chips</span>
</div>
</body></html>
