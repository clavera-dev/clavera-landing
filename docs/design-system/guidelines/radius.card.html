<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-base);display:flex;gap:16px;align-items:flex-end;box-sizing:border-box;font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary)}.sq{width:72px;height:72px;background:var(--bg-elevated-2);border:1px solid var(--border-hairline-strong);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}</style>
</head><body>
<div class="sq" style="border-radius:var(--radius-xs)">xs</div>
<div class="sq" style="border-radius:var(--radius-sm)">sm</div>
<div class="sq" style="border-radius:var(--radius-md)">md</div>
<div class="sq" style="border-radius:var(--radius-lg)">lg</div>
<div class="sq" style="border-radius:var(--radius-xl)">xl</div>
<div class="sq" style="border-radius:var(--radius-pill)">pill</div>
</body></html>
